apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: ci-cd-pipeline
  namespace: sn-labs-ghitabounoua
spec:
  params:
    - name: repo-url
      type: string
      default: https://github.com/ghitabnr/ci-cd-final-project.git
    - name: repo-branch
      type: string
      default: main
    - name: app-name
      type: string
      default: ci-cd-final-project
    - name: build-image
      type: string
      default: image-registry.openshift-image-registry.svc:5000/sn-labs-ghitabounoua/ci-cd-final-project:latest
  workspaces:
    - name: output
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
        kind: Task
      workspaces:
        - name: source
          workspace: output
    - name: git-clone
      runAfter:
        - cleanup
      taskRef:
        name: git-clone
        kind: ClusterTask
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.repo-branch)
      workspaces:
        - name: output
          workspace: output
    - name: flake8
      runAfter:
        - git-clone
      taskRef:
        name: flake8
        kind: Task
      workspaces:
        - name: source
          workspace: output
    - name: nose
      runAfter:
        - flake8
      taskRef:
        name: nose
        kind: Task
      params:
        - name: args
          value: -v --with-spec --spec-color --with-coverage --cover-package=service
      workspaces:
        - name: source
          workspace: output
    - name: buildah
      runAfter:
        - nose
      taskRef:
        name: buildah
        kind: ClusterTask
      params:
        - name: IMAGE
          value: $(params.build-image)
        - name: BUILD_EXTRA_ARGS
          value: --ulimit nproc=4096:4096
      workspaces:
        - name: source
          workspace: output
    - name: deploy
      runAfter:
        - buildah
      taskRef:
        name: openshift-client
        kind: ClusterTask
      params:
        - name: SCRIPT
          value: |
            oc create deployment $(params.app-name) --image=$(params.build-image) --dry-run=client -o yaml | oc apply -f -
      workspaces:
        - name: manifest-dir
          workspace: output
